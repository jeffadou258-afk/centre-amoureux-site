<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de partage — 1200 × 630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --brand:#ED6C10; --brand2:#EF9C19; --brand3:#ED2727; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Inter", system-ui, sans-serif; background: #140d06; color: #fff; position: relative; }
  .halo {
    position: absolute; inset: -55% -18% auto auto; width: 900px; height: 900px;
    background:
      radial-gradient(circle at 45% 45%, rgba(237,108,16,.45), transparent 58%),
      radial-gradient(circle at 70% 70%, rgba(239,156,25,.38), transparent 55%);
    filter: blur(20px); opacity: .85;
  }
  .voile {
    position: absolute; inset: 0;
    background:
      linear-gradient(100deg, rgba(10,7,4,.94) 0%, rgba(10,7,4,.78) 42%, rgba(10,7,4,.18) 78%, rgba(10,7,4,.05) 100%),
      linear-gradient(0deg, rgba(10,7,4,.86) 0%, transparent 38%);
  }
  .grille {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse at 75% 20%, #000, transparent 70%);
  }
  .contenu {
    position: relative; height: 100%; padding: 66px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .marque { display: flex; align-items: center; gap: 20px; }
  .marque img { height: 92px; width: auto; }
  .nom { font-size: 23px; font-weight: 600; letter-spacing: -.01em; }
  .sous { font-size: 12px; font-weight: 600; letter-spacing: .22em; color: #EF9C19; text-transform: uppercase; margin-top: 5px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: 72px; line-height: 1.05; letter-spacing: -.025em; font-weight: 600; max-width: 900px; }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #ED2727, #ED6C10 45%, #EF9C19);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .bas { display: flex; align-items: center; justify-content: space-between; font-size: 19px; color: rgba(255,255,255,.78); }
  .barre { height: 4px; width: 100%; border-radius: 4px; background: linear-gradient(90deg,#ED2727,#ED6C10 45%,#EF9C19); margin-bottom: 26px; }
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="voile"></div>
  <div class="grille"></div>
  <div class="contenu">
    <div class="marque">
      <img src="../assets/img/logo-flamme.png" alt="">
      <div>
        <div class="nom">Centre des Amoureux de Dieu</div>
        <div class="sous">Cocody Rivera 2 · Abidjan</div>
      </div>
    </div>
    <div>
      <div class="barre"></div>
      <h1>Un lieu pour <em>aimer Dieu</em>, et être aimé de Lui.</h1>
    </div>
    <div class="bas">
      <span>Culte dimanche 14h – 18h30</span>
      <span>centre-des-amoureux.org</span>
    </div>
  </div>
</body>
</html>
